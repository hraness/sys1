<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Introducing Sys1</title><style>
@font-face{font-family:Nebula;src:url(data:font/woff2;base64,__NEBULA_BOOK__);font-weight:400}@font-face{font-family:Nebula;src:url(data:font/woff2;base64,__NEBULA_SEMIBOLD__);font-weight:600}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#e1e2e7}canvas{display:block;width:100%;height:100%}
</style></head><body><canvas id="film"></canvas><script type="module">
const fontsReady=Promise.all([document.fonts.load('400 48px Nebula'),document.fonts.load('600 48px Nebula')]);
const canvas=document.querySelector('#film'),ctx=canvas.getContext('2d'),W=1920,H=1080;
SlopcameraOverlay.ready(fontsReady);
canvas.width=SlopcameraOverlay.width;canvas.height=SlopcameraOverlay.height;
const light={bg:'#e1e2e7',ink:'#343b58',muted:'#596481',line:'#b5bbd0',blue:'#34548a',card:'#eceef3',soft:'#c9d2e3'};
const dark={bg:'#1a1b26',ink:'#c0caf5',muted:'#939fc9',line:'#40476b',blue:'#7aa2f7',card:'#24283b',soft:'#303d60'};let C=light;
const clamp=(n,a=0,b=1)=>Math.max(a,Math.min(b,n));const ease=n=>1-Math.pow(1-clamp(n),4);const smooth=n=>{n=clamp(n);return n*n*(3-2*n)};const reveal=(t,d=0,s=.7)=>ease((t-d)/s);
function layer(a,fn){if(a<=0)return;ctx.save();ctx.globalAlpha*=clamp(a);fn();ctx.restore()}
function text(s,x,y,size=42,color=C.ink,weight=400,align='left'){ctx.fillStyle=color;ctx.font=`${weight} ${size}px Nebula`;ctx.textAlign=align;ctx.textBaseline='alphabetic';ctx.fillText(s,x,y)}
function line(x1,y1,x2,y2,p=1,color=C.line,width=2){ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x1+(x2-x1)*clamp(p),y1+(y2-y1)*clamp(p));ctx.lineWidth=width;ctx.strokeStyle=color;ctx.stroke()}
function dot(x,y,r=7,color=C.blue){ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fillStyle=color;ctx.fill()}
function rect(x,y,w,h,color=C.card,r=12){ctx.fillStyle=color;ctx.beginPath();ctx.roundRect(x,y,w,h,r);ctx.fill()}
function outline(x,y,w,h,color=C.line,r=12){ctx.strokeStyle=color;ctx.lineWidth=2;ctx.beginPath();ctx.roundRect(x,y,w,h,r);ctx.stroke()}
function tag(s,x,y,w){rect(x,y,w,44,C.soft,22);text(s,x+18,y+29,23,C.blue,600)}function label(s,x,y){text(s,x,y,25,C.muted,600)}
function mark(x,y,size,color=C.blue){ctx.save();ctx.translate(x,y);ctx.scale(size/160,size/160);ctx.fillStyle=color;ctx.fill(new Path2D('M40 16H120Q144 16 144 40V120Q144 144 120 144H40Q16 144 16 120V40Q16 16 40 16Z M76 42H96V108H112V124H52V108H76V63L56 75L47 61Z'),'evenodd');ctx.restore()}
function footer(chapter){line(112,955,1808,955,1,C.line,1.5);text('Sys1',112,1002,24,C.muted,600);text(chapter,1808,1002,23,C.muted,400,'right')}
function title(a,b,t){layer(reveal(t),()=>{const y=36*(1-reveal(t));text(a,112,195+y,82,C.ink,600);if(b)text(b,114,256+y,31,C.muted)})}
function enter(t,d,fn){let p=reveal(t,d);layer(p,()=>{ctx.translate(0,28*(1-p));fn(p)})}
function opening(t,final=false){layer(.22+.78*reveal(t,0,1.2),()=>{mark(104,119,104);text('Hraness',236,186,33,C.muted)});layer(reveal(t,.18,1.1),()=>text('Introducing',112,392+38*(1-reveal(t,.18,1.1)),63,C.muted));layer(reveal(t,.4,1.25),()=>text('Sys1',98,661+62*(1-reveal(t,.4,1.25)),282,C.ink,600));line(112,725,1808,725,reveal(t,.8,1.4),C.blue,3);enter(t,1.2,()=>text('Review changes. Check completion claims.',112,810,46,C.ink));enter(t,1.6,()=>text(final?'sys1.io':'Skills for coding agents · A typed decision API',112,881,final?44:29,final?C.blue:C.muted,final?600:400));if(final)enter(t,1.6,()=>text('MIT source',1808,881,28,C.muted,400,'right'));else layer(reveal(t,1.8),()=>dot(112+smooth((t-1.8)/3.8)*1696,725,8))}
function premise(t){title('Give your coding agent','a repeatable check.',t);enter(t,.4,()=>{text('Repository rules',112,444,57,C.ink,600);text('What this change should respect.',112,507,31,C.muted);line(112,553,746,553)});enter(t,.85,()=>{text('Change evidence',1060,444,57,C.ink,600);text('What the repository shows.',1060,507,31,C.muted);line(1060,553,1808,553)});layer(reveal(t,1.4),()=>{line(430,553,430,688,reveal(t,1.4));line(1430,553,1430,688,reveal(t,1.4));line(430,688,1430,688,reveal(t,1.7));line(960,688,960,761,reveal(t,2))});enter(t,2.25,()=>{rect(573,765,774,102,C.ink,9);text('A focused question',960,832,45,C.bg,600,'center')});footer('01 / Review and verification')}
function review(t){title('Review a change against','your repository’s rules.',t);enter(t,.35,()=>{label('Selected change',112,358);rect(112,388,870,342);label('Illustrative example',144,436);ctx.font='29px ui-monospace, monospace';ctx.fillStyle=C.muted;ctx.fillText('const input = await request.json();',144,518);ctx.fillStyle=C.ink;ctx.fillText('await store.save(input);',144,571);line(145,590,801,590,reveal(t,1.3,1.1),C.blue,5);text('Validate input before use.',144,677,34,C.ink,600)});enter(t,.7,()=>{label('Repository rule',1090,358);text('Check untrusted input',1090,436,40,C.ink,600);text('before persistence.',1090,488,40,C.ink,600);text('Select rules and paths.',1090,585,30,C.muted);text('Preview the request.',1090,634,30,C.muted);text('Then choose the model call.',1090,683,30,C.muted)});layer(reveal(t,2.4),()=>{line(550,730,550,806,reveal(t,2.4));line(550,806,1090,806,reveal(t,2.6));dot(1090,806,7)});enter(t,3,()=>{text('Investigate the finding',1130,822,38,C.blue,600);text('Advisory review',1130,867,26,C.muted)});footer('02 / sys1-review')}
function verify(t){title('Check what “done” means.','Compare a completion claim with reachable evidence.',t);enter(t,.45,()=>{label('Claim',112,370);text('“All tests passed.”',112,477,69,C.ink,600);line(112,516,812,516,reveal(t,1),C.blue,4)});enter(t,1,()=>{label('Evidence · Session transcript',1070,370);rect(1070,411,738,154,C.card,10);text('Test run: one failure.',1110,504,47,C.ink,600)});layer(reveal(t,1.8),()=>{line(462,516,462,675,reveal(t,1.8));line(1439,565,1439,675,reveal(t,1.8));line(462,675,1439,675,reveal(t,2));line(960,675,960,737,reveal(t,2.2))});enter(t,2.7,()=>{rect(648,742,624,104,C.soft,10);text('Contradicted',960,810,48,C.blue,600,'center');text('Unavailable evidence remains unverifiable.',960,903,30,C.muted,400,'center')});footer('03 / sys1-verify · Illustrative example · Advisory')}
function answers(t){title('Typed decisions','for your application.',t);[112,705,1298].forEach((x,i)=>enter(t,.4+i*.24,()=>{line(x,350,x+510,350);label(['Yes / no','Choice','Score'][i],x,405);const p=reveal(t,1+i*.3,1.25);if(i===0){dot(x+134,596,78*p,C.blue);outline(x+294-78*p,596-78*p,156*p,156*p,C.line,78*p);text('yes',x+134,610,36,C.bg,600,'center');text('no',x+294,610,36,C.muted,400,'center')}if(i===1){['urgent','normal','later'].forEach((s,j)=>{rect(x+10,464+j*91,428*p,69,j===1?C.blue:C.card,5);layer(p,()=>text(s,x+40,511+j*91,31,j===1?C.bg:C.muted,j===1?600:400))})}if(i===2){for(let j=0;j<5;j++){let v=clamp(p*5-j);rect(x+j*91,652-(j+1)*36*v,68,(j+1)*36*v,C.blue,4)}text('A defined scale',x,740,30,C.muted)}}));enter(t,2.3,()=>{text('Validated answers through one API.',112,874,40,C.ink);text('State + questions → probabilities',1808,874,30,C.muted,400,'right')});footer('04 / System One decisions')}
function routes(t){title('Choose where decisions run.','Sys1 routes each request to the backend you select.',t);enter(t,.3,()=>{rect(112,449,290,171,C.soft,12);mark(126,473,122);text('Sys1',266,550,50,C.ink,600)});[{y:345,title:'Cloudflare Clef',sub:'Workers AI decision model',status:'Opt-in'},{y:545,title:'Local Qwen',sub:'Runs on your machine',status:'Experimental'},{y:745,title:'Your compatible server',sub:'A System One HTTP endpoint',status:'Explicit configuration'}].forEach((d,i)=>{layer(reveal(t,.5+i*.18),()=>{line(402,535,610,535,reveal(t,.5));line(610,535,610,d.y+30,reveal(t,.75));line(610,d.y+30,758,d.y+30,reveal(t,1+i*.2));dot(758,d.y+30,6)});enter(t,.85+i*.22,()=>{text(d.title,807,d.y+37,43,C.ink,600);text(d.sub,807,d.y+87,29,C.muted);text(d.status,1808,d.y+37,28,C.blue,600,'right')})});footer('05 / Cloudflare Clef is disabled in fresh configuration')}
function profiles(t){title('Explore reusable profiles.','',t);[['Failure triage','Classify a reported failure.'],['Excerpt relevance','Judge whether an excerpt answers a question.'],['Claim support','Check a claim against supplied evidence.']].forEach((row,i)=>enter(t,.3+i*.22,()=>{const y=380+i*151;line(112,y-39,1808,y-39);text(String(i+1).padStart(2,'0'),112,y+25,28,C.blue,600);text(row[0],207,y+28,47,C.ink,600);}));enter(t,1.3,()=>tag('Source-checkout experiments',112,866,453));footer('06 / Experimental profiles')}
const shots=[{a:0,b:6,draw:opening,theme:light},{a:6,b:12,draw:premise,theme:light},{a:12,b:20,draw:review,theme:light},{a:20,b:28,draw:verify,theme:light},{a:28,b:35,draw:answers,theme:dark},{a:35,b:42,draw:routes,theme:dark},{a:42,b:46,draw:profiles,theme:light},{a:46,b:52,draw:t=>opening(t+3,true),theme:light}];
function drawAt(t){ctx.setTransform(canvas.width/W,0,0,canvas.height/H,0,0);const shot=shots.find(s=>t>=s.a&&t<s.b)||shots.at(-1);C=shot.theme;ctx.globalAlpha=1;ctx.fillStyle=C.bg;ctx.fillRect(0,0,W,H);shot.draw(t-shot.a);if(shot.a>0&&t-shot.a<.32){let p=smooth((t-shot.a)/.32);ctx.fillStyle=C.blue;ctx.fillRect(W*p,0,30*(1-p),H)}}
SlopcameraOverlay.onFrame(async ({timeMs})=>{await fontsReady;const reviews=SlopcameraOverlay.parameters.reviewTimes;drawAt(reviews?reviews[Math.min(reviews.length-1,Math.floor(timeMs/1000))]:timeMs/1000)});
</script></body></html>
