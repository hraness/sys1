name: Production site browser
on:
  # Vercel posts a deployment status for every deployment; only a successful
  # Production deployment runs the browser check (previews are skipped).
  deployment_status:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: production-site-browser-${{ github.event.deployment.sha || github.sha }}
  cancel-in-progress: false
jobs:
  browser:
    name: Production browser
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.deployment_status.state == 'success' &&
      github.event.deployment.environment == 'Production')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.deployment.sha || github.sha }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.14"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          package-manager-cache: false
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-site-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-site-${{ runner.os }}-
      - run: bun install --frozen-lockfile --ignore-scripts
      - name: Cache Chromium
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: site-chromium-${{ runner.os }}-1.58.2
      - name: Install Chromium
        run: node node_modules/playwright-core/cli.js install --with-deps chromium
      - name: Check public pages in a browser
        env:
          SYS1_BROWSER_ARTIFACTS: ${{ runner.temp }}/site-browser
        run: bun scripts/verify-site-browser.ts --production
      - name: Save public page screenshots
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: production-site-browser
          path: ${{ runner.temp }}/site-browser
          retention-days: 7

