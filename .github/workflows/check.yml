name: Check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.19.0
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun run check
      - name: Validate Hugging Face export
        run: |
          python3 -B hf/stage.py
          python3 -B -m unittest discover -s hf -p 'test_*.py'
      - name: Install candidate and verify native readiness
        run: bun run check:native

  platform:
    name: Platform (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-2025]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.19.0
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun run check
      - name: Install candidate and verify native readiness
        run: bun run check:native

  site:
    name: Static site browser
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: ./node_modules/.bin/playwright-core install --with-deps chromium
      - name: Verify public routes and save visual evidence
        env:
          SYS1_BROWSER_ARTIFACTS: ${{ github.workspace }}/site-browser-artifacts
        run: bun scripts/verify-site-browser.ts
      - name: Upload site browser evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sys1-site-browser-${{ github.sha }}
          path: site-browser-artifacts/
          if-no-files-found: error
          retention-days: 7

  required:
    name: Required
    if: always()
    needs: [check, platform, site]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every selected job
        env:
          CHECK: ${{ needs.check.result }}
          PLATFORM: ${{ needs.platform.result }}
          SITE: ${{ needs.site.result }}
        run: |
          set -euo pipefail
          for result in "$CHECK" "$PLATFORM" "$SITE"; do
            if [[ "$result" != success ]]; then
              printf 'Unexpected required job result: %s\n' "$result"
              exit 1
            fi
          done
