name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: sys1-stable-release
  cancel-in-progress: false

jobs:
  verify:
    name: Verify release source
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      artifact_digest: ${{ steps.artifact.outputs.artifact-digest }}
      artifact_id: ${{ steps.artifact.outputs.artifact-id }}
      sha: ${{ steps.identity.outputs.sha }}
      tag: ${{ steps.identity.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 1
          fetch-tags: false
          persist-credentials: false
          ref: refs/tags/${{ github.ref_name }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.19.0
      - name: Verify tag, package and main authority
        id: identity
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [[ ! "$TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::Release tag is not a stable semantic version"
            exit 1
          fi
          version="$(bun -e 'const p = await Bun.file("package.json").json(); process.stdout.write(String(p.version))')"
          if [[ "$TAG" != "v$version" ]]; then
            echo "::error::Tag $TAG does not match package version v$version"
            exit 1
          fi
          sha="$(git rev-parse HEAD)"
          main_sha="$(gh api "repos/$REPOSITORY/git/ref/heads/${{ github.event.repository.default_branch }}" --jq '.object.sha')"
          if [[ "$sha" != "$main_sha" ]]; then
            echo "::error::Release commit is not the exact current default-branch head"
            exit 1
          fi
          tag_type="$(gh api "repos/$REPOSITORY/git/ref/tags/$TAG" --jq '.object.type')"
          if [[ "$tag_type" != "tag" ]]; then
            echo "::error::Release tag must be annotated"
            exit 1
          fi
          target_sha="$(gh api "repos/$REPOSITORY/git/ref/tags/$TAG" --jq '.object.sha' | xargs -I{} gh api "repos/$REPOSITORY/git/tags/{}" --jq '.object.sha')"
          if [[ "$target_sha" != "$sha" ]]; then
            echo "::error::Annotated tag does not target the verified commit"
            exit 1
          fi
          printf 'sha=%s\ntag=%s\n' "$sha" "$TAG" >> "$GITHUB_OUTPUT"
      - name: Require release notes in CHANGELOG.md
        env:
          TAG: ${{ github.ref_name }}
        run: bun scripts/release-notes.ts check "$TAG"
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun run check
      - name: Pack exact artifact and checksum
        run: |
          set -euo pipefail
          mkdir artifacts
          npm pack --ignore-scripts --pack-destination artifacts .
          cd artifacts
          shasum -a 256 ./*.tgz > SHA256SUMS
      - name: Preserve exact release bytes
        id: artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: sys1-release-${{ github.run_attempt }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 30

  install:
    name: Exact artifact install (${{ matrix.os }})
    needs: verify
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 1
          fetch-tags: false
          persist-credentials: false
          ref: ${{ needs.verify.outputs.sha }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.19.0
      - run: bun install --frozen-lockfile --ignore-scripts
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          artifact-ids: ${{ needs.verify.outputs.artifact_id }}
          merge-multiple: true
          path: artifacts
      - name: Bind and execute the exact package
        env:
          ARTIFACT_DIGEST: ${{ needs.verify.outputs.artifact_digest }}
          ARTIFACT_ID: ${{ needs.verify.outputs.artifact_id }}
        run: bun scripts/release-install-smoke.ts artifacts

  publish:
    name: Publish immutable GitHub Release
    needs: [verify, install]
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 1
          fetch-tags: false
          persist-credentials: false
          ref: ${{ needs.verify.outputs.sha }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          artifact-ids: ${{ needs.verify.outputs.artifact_id }}
          merge-multiple: true
          path: artifacts
      - name: Publish and prove exact immutable assets
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          SHA: ${{ needs.verify.outputs.sha }}
          TAG: ${{ needs.verify.outputs.tag }}
        run: |
          set -euo pipefail
          cd artifacts
          shasum -a 256 -c SHA256SUMS
          cd ..
          notes="$RUNNER_TEMP/release-notes.md"
          record=(--tag "$TAG" --commit "$SHA" --repository "$REPOSITORY" --artifacts artifacts)
          title="$(bun scripts/release-notes.ts title "$TAG")"
          bun scripts/release-notes.ts render "${record[@]}" > "$notes"
          if ! gh release view "$TAG" --repo "$REPOSITORY" >/dev/null 2>&1; then
            gh release create "$TAG" artifacts/*.tgz artifacts/SHA256SUMS \
              --repo "$REPOSITORY" \
              --title "$title" \
              --notes-file "$notes" \
              --verify-tag
          fi
          release="$(gh api "repos/$REPOSITORY/releases/tags/$TAG")"
          if [[ "$(jq -r '.name' <<<"$release")" != "$title" ]]; then
            echo "::error::GitHub Release title is not $title"
            exit 1
          fi
          jq -j '.body' <<<"$release" > "$RUNNER_TEMP/release-body.md"
          if ! bun scripts/release-notes.ts verify --body-file "$RUNNER_TEMP/release-body.md" "${record[@]}"; then
            echo "::error::GitHub Release page does not match CHANGELOG.md and the release record"
            exit 1
          fi
          if [[ "$(jq -r '.immutable' <<<"$release")" != "true" || "$(jq -r '.draft' <<<"$release")" != "false" ]]; then
            echo "::error::GitHub Release is not immutable and published"
            exit 1
          fi
          tag_object="$(gh api "repos/$REPOSITORY/git/ref/tags/$TAG" --jq '.object.sha')"
          target_sha="$(gh api "repos/$REPOSITORY/git/tags/$tag_object" --jq '.object.sha')"
          if [[ "$target_sha" != "$SHA" ]]; then
            echo "::error::GitHub Release tag does not bind the verified commit"
            exit 1
          fi
          mapfile -t local_assets < <(printf '%s\n' artifacts/*.tgz artifacts/SHA256SUMS)
          if [[ "$(jq '.assets | length' <<<"$release")" -ne "${#local_assets[@]}" ]]; then
            echo "::error::GitHub Release asset count is wrong"
            exit 1
          fi
          for source in "${local_assets[@]}"; do
            name="$(basename "$source")"
            expected="sha256:$(shasum -a 256 "$source" | awk '{print $1}')"
            observed="$(jq -r --arg name "$name" '.assets[] | select(.name == $name) | .digest' <<<"$release")"
            if [[ "$observed" != "$expected" ]]; then
              echo "::error::Release digest mismatch for $name"
              exit 1
            fi
          done
          directory="$(mktemp -d)"
          gh release download "$TAG" --repo "$REPOSITORY" --dir "$directory"
          for source in "${local_assets[@]}"; do
            cmp "$source" "$directory/$(basename "$source")"
          done

  npm:
    # Publishes the exact tarball the GitHub Release carries to npm through npm
    # trusted publishing: the registry exchanges this job's GitHub OIDC token
    # for a short-lived credential, so no npm token is stored and no one
    # approves the release. CONTRIBUTING.md lists the one-time registry setup.
    name: Publish to npm
    needs: [verify, publish]
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      EXPECTED_NAME: "@hraness/sys1"
      TAG: ${{ needs.verify.outputs.tag }}
    steps:
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.19.0
          package-manager-cache: false
          registry-url: "https://registry.npmjs.org"
      - name: Pin npm
        run: |
          set -euo pipefail
          npm install --global npm@11.19.0 --ignore-scripts --registry=https://registry.npmjs.org
          test "$(npm --version)" = "11.19.0"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          artifact-ids: ${{ needs.verify.outputs.artifact_id }}
          merge-multiple: true
          path: artifacts
      - name: Publish the released tarball
        run: |
          set -euo pipefail
          cd artifacts
          shasum -a 256 -c SHA256SUMS
          tarballs=(./*.tgz)
          if [[ "${#tarballs[@]}" -ne 1 ]]; then
            echo "::error::Expected exactly one release tarball"
            exit 1
          fi
          tarball="${tarballs[0]}"
          manifest="$(tar -xOzf "$tarball" package/package.json)"
          name="$(node -e 'process.stdout.write(JSON.parse(process.argv[1]).name)' "$manifest")"
          version="$(node -e 'process.stdout.write(JSON.parse(process.argv[1]).version)' "$manifest")"
          if [[ "$name" != "$EXPECTED_NAME" || "v$version" != "$TAG" ]]; then
            echo "::error::Tarball holds $name@$version, expected $EXPECTED_NAME at $TAG"
            exit 1
          fi
          probe="$RUNNER_TEMP/npm-view.txt"
          if ! npm view "$name" name --json --registry=https://registry.npmjs.org >/dev/null 2>"$probe"; then
            if grep -q E404 "$probe"; then
              echo "::warning::$name is not on npm yet, so trusted publishing cannot run. CONTRIBUTING.md lists the one-time setup."
              exit 0
            fi
            cat "$probe"
            echo "::error::Could not read $name from npm"
            exit 1
          fi
          if npm view "$name@$version" version --json --registry=https://registry.npmjs.org >/dev/null 2>"$probe"; then
            echo "::notice::$name@$version is already on npm"
            exit 0
          elif ! grep -q E404 "$probe"; then
            cat "$probe"
            echo "::error::Could not check whether $name@$version is on npm"
            exit 1
          fi
          npm publish "$tarball" --access public --provenance --ignore-scripts --registry=https://registry.npmjs.org
          expected="$(shasum -a 1 "$tarball" | awk '{print $1}')"
          for _ in $(seq 1 10); do
            view="$(npm view "$name@$version" dist.shasum dist.attestations.provenance.predicateType --json --prefer-online --registry=https://registry.npmjs.org 2>/dev/null || true)"
            if [[ "$(jq -r '."dist.shasum" // empty' <<<"$view")" == "$expected" \
              && "$(jq -r '."dist.attestations.provenance.predicateType" // empty' <<<"$view")" == "https://slsa.dev/provenance/v1" ]]; then
              echo "Published $name@$version from the released tarball with provenance"
              exit 0
            fi
            sleep 15
          done
          echo "::error::npm does not report $name@$version with the released tarball and a provenance attestation"
          exit 1
